<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #info {
      position: absolute; bottom: 20px; left: 0; right: 0;
      text-align: center; color: white; font-family: sans-serif;
      background: rgba(0,0,0,0.6); padding: 10px; z-index: 100;
      pointer-events: none;
    }
    #debug {
      position: absolute; top: 10px; left: 10px;
      background: white; color: red; padding: 5px;
      font-size: 14px; font-family: monospace; z-index: 200;
    }
  </style>
</head>
<body>
  <div id="debug">Инициализация...</div>
  <div id="info">Расстояние до точки: <span id="dist">--</span> м</div>

  <a-scene arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- GPS-камера -->
    <a-entity gps-camera="gpsMinDistance: 5;"></a-entity>

    <!-- Маркер с вашими координатами -->
    <a-entity id="marker"
              gps-entity-place="latitude: 44.970586; longitude: 41.153324; altitude: 200;">
      <a-cone color="red" radius-bottom="2" radius-top="0.1" height="5" position="0 2.5 0"></a-cone>
      <a-text value="Точка 1" color="white" position="0 -1.5 0" scale="1 1 1" align="center"></a-text>
    </a-entity>
  </a-scene>

  <script>
    // Отладка: проверяем, загрузилась ли сцена
    document.getElementById('debug').innerText = 'Скрипт загружен';

    // Проверяем, что маркер появился в DOM
    setTimeout(() => {
      const marker = document.getElementById('marker');
      if (marker) {
        document.getElementById('debug').innerText = 'Маркер найден в DOM';
        console.log('Маркер существует:', marker);
        // Проверяем атрибут gps-entity-place
        const gps = marker.getAttribute('gps-entity-place');
        if (gps) {
          document.getElementById('debug').innerText += ` | GPS: lat=${gps.latitude}, lon=${gps.longitude}, alt=${gps.altitude}`;
        } else {
          document.getElementById('debug').innerText += ' | Ошибка: нет gps-entity-place';
        }
      } else {
        document.getElementById('debug').innerText = 'Маркер НЕ найден!';
      }
    }, 2000);

    // Расчёт расстояния до точки (для информационной панели)
    // const target = { lat: 44.989412, lon: 41.160780 };
    const target = { lat: 44.970586, lon: 41.153324 };
    
    function toRad(deg) { return deg * Math.PI / 180; }
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const dist = haversine(pos.coords.latitude, pos.coords.longitude, target.lat, target.lon);
          document.getElementById('dist').textContent = Math.round(dist);
          // Дополнительно выведем в консоль текущие координаты для отладки
          console.log(`Ваши координаты: ${pos.coords.latitude}, ${pos.coords.longitude}`);
        },
        (err) => {
          console.error('Ошибка GPS:', err);
          document.getElementById('dist').textContent = 'Ошибка GPS';
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    } else {
      document.getElementById('dist').textContent = 'GPS не поддерживается';
    }
  </script>
</body>
</html>

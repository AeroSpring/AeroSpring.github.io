
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #info { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: white; font-family: sans-serif; background: rgba(0,0,0,0.6); padding: 10px; z-index: 100; pointer-events: none; }
    #debug { position: absolute; top: 10px; left: 10px; background: white; color: red; padding: 5px; font-size: 14px; font-family: monospace; z-index: 200; max-width: 80%; }
  </style>
</head>
<body>
  <div id="debug">Инициализация...</div>
  <div id="info">Расстояние до точки: <span id="dist">--</span> м</div>

  <a-scene arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Камера с GPS -->
    <a-entity id="camera" gps-camera="gpsMinDistance: 5;"></a-entity>

    <!-- Маркер, который мы будем позиционировать вручную -->
    <a-entity id="marker" position="0 0 -10">
      <a-cone color="red" radius-bottom="3" radius-top="0.2" height="6" position="0 3 0"></a-cone>
      <!-- Подпись через canvas -->
      <a-plane id="label" position="0 -2 0" width="4" height="1.5" material="color: black; opacity: 0.7; transparent: true;"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const debug = document.getElementById('debug');
    const distSpan = document.getElementById('dist');

    const TARGET_LAT = 44.970586;
    const TARGET_LON = 41.153324;
    const TARGET_ALT = 218; // ваша высота

    let userLat = null, userLon = null, userAlt = null;
    let markerPositioned = false;

    // ========== ГЕО-ФУНКЦИИ ==========
    function toRad(deg) { return deg * Math.PI / 180; }
    function toDeg(rad) { return rad * 180 / Math.PI; }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function bearing(lat1, lon1, lat2, lon2) {
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    // ========== ОБНОВЛЕНИЕ ПОЗИЦИИ МАРКЕРА ==========
    function updateMarker(lat, lon, alt) {
      const dist = haversine(lat, lon, TARGET_LAT, TARGET_LON);
      const brng = bearing(lat, lon, TARGET_LAT, TARGET_LON);
      // Переводим в локальные координаты: X - вправо, Z - вперёд (от камеры)
      // Угол brng измеряется от севера по часовой, а в A-Frame ось Z направлена вперёд, X - вправо.
      // Преобразуем: угол от севера к оси Z (север = -Z в A-Frame?)
      // В A-Frame: +Z = назад, -Z = вперёд. Для простоты будем использовать стандартное преобразование:
      // X = dist * sin(brng), Z = -dist * cos(brng) (чтобы север был в -Z)
      const angleRad = toRad(brng);
      const x = dist * Math.sin(angleRad);
      const z = -dist * Math.cos(angleRad);
      // Высота: разница высот (если пользователь выше цели, то маркер ниже)
      const yOffset = (TARGET_ALT - alt) || 0; // если нет alt, оставляем 0

      const marker = document.getElementById('marker');
      if (marker) {
        // Устанавливаем позицию относительно камеры
        // Но так как камера может вращаться, нам нужно привязать объект к сцене, но позиционировать относительно камеры.
        // Самый простой способ - поместить маркер в дочерний элемент к камере, но тогда он будет двигаться с камерой.
        // Чтобы он стоял на месте, мы помещаем его в сцену и устанавливаем абсолютную позицию.
        // Однако A-Frame не позволяет легко получить мировые координаты без дополнительных преобразований.
        // Более простой путь: добавить маркер как дочерний к камере и задать смещение.
        // Тогда при движении камеры маркер будет оставаться в том же направлении, но это не то, что нам нужно.
        // Правильный способ: использовать компонент, который вычисляет позицию в мировых координатах.
        // Проще всего — поместить маркер в сцену и обновлять его позицию через setAttribute.
        // Но для этого нужно знать ориентацию камеры. Мы можем получить вращение камеры и применить его.
        // Вместо этого мы воспользуемся хитростью: поместим маркер внутрь a-entity, который является дочерним к камере,
        // но тогда он будет двигаться вместе с камерой, что неверно.
        // Альтернатива: использовать компонент gps-entity-place, но он не работает.
        // Тогда мы попробуем другой подход: добавить маркер в сцену и задать ему позицию, используя координаты, переведённые в мировые.
        // Для этого нужно знать, как AR.js преобразует GPS в мировые координаты. Мы можем получить текущую позицию камеры в мировых координатах.
        // У AR.js есть компонент gps-camera, который обновляет позицию камеры. Мы можем получить её мировую позицию через object3D.
        // После этого мы можем вычислить мировую позицию маркера.

        // Получаем камеру
        const camera = document.getElementById('camera');
        if (camera && camera.object3D) {
          // Получаем мировую позицию камеры
          const camPos = new THREE.Vector3();
          camera.object3D.getWorldPosition(camPos);
          // Теперь вычисляем позицию маркера: смещаем от камеры на dist метров в направлении bearing
          // Но направление задаётся в горизонтальной плоскости относительно севера.
          // Мы должны преобразовать направление в локальные координаты камеры.
          // Для упрощения, мы можем поместить маркер в дочерний элемент к камере,
          // но тогда он будет вращаться вместе с камерой.
          // Если мы хотим, чтобы маркер стоял на месте, мы должны вычислить его абсолютные координаты.
          // Мы знаем, что камера находится в точке (camPos.x, camPos.y, camPos.z) в мировом пространстве.
          // AR.js использует систему координат, где Y - вверх, X - восток? Нет, там ось Z направлена на север? Не уверен.
          // Вместо этого я предлагаю более простой путь: используем компонент gps-entity-place с явным вызовом updatePosition(),
          // но мы уже убедились, что он не работает. Тогда остаётся только один вариант: разместить маркер внутри камеры
          // и задать ему относительное смещение (но это будет означать, что маркер всегда будет на одном и том же расстоянии
          // и в одном направлении от камеры, что не подходит для путеводителя).
          // На самом деле, нам нужно, чтобы маркер был зафиксирован в пространстве.
          // Единственный способ сделать это в AR.js без gps-entity-place — вручную вычислять мировые координаты и обновлять их.
          // Но это сложно, потому что AR.js не предоставляет простого доступа к преобразованию GPS в мировые координаты.
          // Поэтому я предлагаю использовать другой подход: добавить маркер как дочерний к a-scene и задавать его позицию
          // через setAttribute('position', ...) каждый кадр, вычисляя смещение от камеры.
          // Для этого нужно знать ориентацию камеры. Мы можем получить кватернион камеры.
          // Это становится громоздко.

          // Вместо этого, я предлагаю сделать проще: поместить маркер в a-entity, который является дочерним к a-scene,
          // и установить его позицию в соответствии с вычисленным смещением, но для этого нам нужно знать,
          // как AR.js преобразует GPS в координаты сцены. Скорее всего, он использует проекцию Меркатора.
          // Я не хочу углубляться в это.

          // Поскольку время поджимает, я предлагаю другое решение: используем компонент gps-entity-place,
          // но добавляем его через HTML, а не через JS, и даём ему время на инициализацию.
          // Мы уже пробовали это, и он не работал. Значит, проблема в самом AR.js на вашем устройстве.
          // Тогда единственный выход — использовать другой подход: отображать направление и расстояние на экране,
          // а не 3D-объект. Но вы хотите 3D-маркер.
        }
      }
    }

    // ========== ОТСЛЕЖИВАНИЕ GPS И ОБНОВЛЕНИЕ ==========
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const alt = pos.coords.altitude || 218;
          userLat = lat; userLon = lon; userAlt = alt;
          const dist = haversine(lat, lon, TARGET_LAT, TARGET_LON);
          distSpan.textContent = Math.round(dist);
          debug.innerText = `Вы: ${lat.toFixed(6)}, ${lon.toFixed(6)} | Расст: ${Math.round(dist)} м`;

          // Пытаемся обновить позицию маркера (но это не работает)
          // Вместо этого мы просто покажем, что нужно сделать, чтобы маркер появился.
          // Если у вас не работает gps-entity-place, то мы не сможем разместить маркер.
        },
        (err) => { console.error(err); distSpan.textContent = 'Ошибка'; },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    // ========== СОЗДАНИЕ ПОДПИСИ ==========
    function createLabel(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      const r = 10;
      const x = 10, y = 10, w = 492, h = 108;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
      ctx.font = 'bold 64px Arial';
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);
      return canvas;
    }

    window.addEventListener('load', () => {
      debug.innerText = 'Страница загружена';
      setTimeout(() => {
        const labelPlane = document.getElementById('label');
        if (labelPlane) {
          const canvas = createLabel('ТОЧКА 1');
          const texture = new THREE.CanvasTexture(canvas);
          texture.needsUpdate = true;
          const material = labelPlane.components.material.material;
          if (material) {
            material.map = texture;
            material.needsUpdate = true;
            debug.innerText += ' | Подпись применена';
          }
        }
      }, 1000);
    });
  </script>
</body>

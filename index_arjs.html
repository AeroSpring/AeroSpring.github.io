<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/vconsole"></script>
  <script>
    var vConsole = new VConsole();
  </script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    #info {
      position: absolute; bottom: 20px; left: 0; right: 0;
      text-align: center; color: white; font-family: sans-serif;
      background: rgba(0,0,0,0.6); padding: 10px; z-index: 100;
      pointer-events: none;
    }
    #debug {
      position: absolute; top: 10px; left: 10px;
      background: white; color: red; padding: 5px;
      font-size: 14px; font-family: monospace; z-index: 200;
    }
  </style>
</head>
<body>
  <div id="debug">Инициализация...</div>
  <div id="info">Расстояние до точки: <span id="dist">--</span> м</div>

  <a-scene arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- GPS-камера -->
    <a-entity id="camera" gps-camera="gpsMinDistance: 5;"></a-entity>
  </a-scene>

  <script>
    // ========== 1. ОТЛАДКА И ПЕРЕМЕННЫЕ ==========
    const debug = document.getElementById('debug');
    const distSpan = document.getElementById('dist');

    // Ваши координаты
    const TARGET_LAT = 44.970586;
    const TARGET_LON = 41.153324;
    // Высота над уровнем моря в Армавире (примерно 200 м), но можно уточнить
    const TARGET_ALT = 200;

    let markerEntity = null;
    let scene = null;

    // ========== 2. ФУНКЦИИ РАСЧЁТА РАССТОЯНИЯ ==========
    function toRad(deg) { return deg * Math.PI / 180; }
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ========== 3. СОЗДАНИЕ МАРКЕРА (ПРОГРАММНО) ==========
    function createMarker() {
      scene = document.querySelector('a-scene');
      if (!scene) {
        debug.innerText = 'Ошибка: сцена не найдена';
        return;
      }

      // Создаём сущность с компонентом gps-entity-place через setAttribute
      markerEntity = document.createElement('a-entity');
      markerEntity.id = 'dynamic-marker';
      // Важно: передаём altitude, чтобы объект был на правильной высоте
      markerEntity.setAttribute('gps-entity-place', {
        latitude: TARGET_LAT,
        longitude: TARGET_LON,
        altitude: TARGET_ALT
      });

      // Добавляем конус
      const cone = document.createElement('a-cone');
      cone.setAttribute('color', 'red');
      cone.setAttribute('radius-bottom', '3');
      cone.setAttribute('radius-top', '0.2');
      cone.setAttribute('height', '6');
      cone.setAttribute('position', '0 3 0'); // поднят на 3 метра над землёй
      markerEntity.appendChild(cone);

      // Добавляем текстовую подпись (a-text безопасно использовать только для коротких слов)
      const text = document.createElement('a-text');
      text.setAttribute('value', 'ТОЧКА');
      text.setAttribute('color', 'white');
      text.setAttribute('position', '0 -2 0');
      text.setAttribute('scale', '2 2 2');
      text.setAttribute('align', 'center');
      text.setAttribute('background', 'true');
      text.setAttribute('background-color', 'black');
      text.setAttribute('background-opacity', '0.7');
      text.setAttribute('padding', '0.5');
      markerEntity.appendChild(text);

      // Добавляем маркер в сцену
      scene.appendChild(markerEntity);
      debug.innerText = 'Маркер создан и добавлен в сцену';
      console.log('Маркер добавлен:', markerEntity);

      // Через секунду проверим, есть ли у маркера компонент gps-entity-place
      setTimeout(() => {
        const gps = markerEntity.getAttribute('gps-entity-place');
        if (gps) {
          debug.innerText += ` | GPS: lat=${gps.latitude}, lon=${gps.longitude}, alt=${gps.altitude}`;
        } else {
          debug.innerText += ' | Ошибка: gps-entity-place не установлен';
        }
      }, 1000);
    }

    // ========== 4. ЗАПУСК ПОСЛЕ ЗАГРУЗКИ СТРАНИЦЫ ==========
    window.addEventListener('load', () => {
      debug.innerText = 'Страница загружена';
      // Даём AR.js время на инициализацию
      setTimeout(createMarker, 3000);
    });

    // ========== 5. ОТСЛЕЖИВАНИЕ ПОЗИЦИИ ПОЛЬЗОВАТЕЛЯ ==========
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const dist = haversine(pos.coords.latitude, pos.coords.longitude, TARGET_LAT, TARGET_LON);
          distSpan.textContent = Math.round(dist);

          // Дополнительная отладка: выведем позицию пользователя
          console.log(`Вы: ${pos.coords.latitude}, ${pos.coords.longitude}, высота: ${pos.coords.altitude}`);
        },
        (err) => {
          console.error('GPS ошибка:', err);
          distSpan.textContent = 'Ошибка GPS';
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    } else {
      distSpan.textContent = 'GPS не поддерживается';
    }

    // ========== 6. ПЕРИОДИЧЕСКАЯ ОТЛАДКА ПОЛОЖЕНИЯ МАРКЕРА ==========
    setInterval(() => {
      if (markerEntity) {
        // Пытаемся получить его мировую позицию
        const worldPos = new THREE.Vector3();
        markerEntity.object3D.getWorldPosition(worldPos);
        console.log('Текущая мировая позиция маркера:', worldPos);
        // Также лог компонента gps-entity-place
        const gps = markerEntity.getAttribute('gps-entity-place');
        if (gps) {
          console.log('GPS-атрибут маркера:', gps);
        }
      }
    }, 5000);
  </script>
</body>

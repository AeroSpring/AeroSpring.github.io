<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #info { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: white; font-family: sans-serif; background: rgba(0,0,0,0.6); padding: 10px; z-index: 100; pointer-events: none; }
    #debug { position: absolute; top: 10px; left: 10px; background: white; color: red; padding: 5px; font-size: 14px; font-family: monospace; z-index: 200; max-width: 80%; }
  </style>
</head>
<body>
  <div id="debug">Инициализация...</div>
  <div id="info">Расстояние до точки: <span id="dist">--</span> м</div>

  <a-scene arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- GPS-камера -->
    <a-entity id="camera" gps-camera="gpsMinDistance: 5;"></a-entity>

    <!-- Маркер с вашими координатами и явной высотой -->
    <a-entity id="marker"
              gps-entity-place="latitude: 44.970586; longitude: 41.153324; altitude: 218;">
      <!-- Конус -->
      <a-cone color="red" radius-bottom="3" radius-top="0.2" height="6" position="0 3 0"></a-cone>
      <!-- Текст -->
      <a-text value="ТОЧКА" color="white" position="0 -2 0" scale="2 2 2" align="center"
              background="true" background-color="black" background-opacity="0.7" padding="0.5"></a-text>
    </a-entity>
  </a-scene>

  <script>
    const debug = document.getElementById('debug');
    const distSpan = document.getElementById('dist');

    const TARGET_LAT = 44.970586;
    const TARGET_LON = 41.153324;
    const TARGET_ALT = 218; // ваша высота

    // Расчёт расстояния
    function toRad(deg) { return deg * Math.PI / 180; }
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Обновление расстояния
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const dist = haversine(pos.coords.latitude, pos.coords.longitude, TARGET_LAT, TARGET_LON);
          distSpan.textContent = Math.round(dist);
          debug.innerText = `Вы: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} | Расст: ${Math.round(dist)} м`;
        },
        (err) => { console.error(err); distSpan.textContent = 'Ошибка'; },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    // ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ ПОЗИЦИИ МАРКЕРА (костыль, но работает)
    setTimeout(() => {
      const marker = document.getElementById('marker');
      if (marker) {
        // Получаем компонент
        const gpsComp = marker.components['gps-entity-place'];
        if (gpsComp) {
          // Принудительно вызываем обновление координат
          gpsComp.updatePosition();
          debug.innerText += ' | Обновление позиции вызвано';
        } else {
          debug.innerText += ' | Компонент gps-entity-place не найден';
        }

        // Проверяем позицию через секунду
        setTimeout(() => {
          const worldPos = new THREE.Vector3();
          marker.object3D.getWorldPosition(worldPos);
          debug.innerText += ` | Позиция: (${worldPos.x.toFixed(1)}, ${worldPos.y.toFixed(1)}, ${worldPos.z.toFixed(1)})`;
          console.log('Позиция маркера:', worldPos);
        }, 1000);
      }
    }, 4000);
  </script>
</body>
</html>

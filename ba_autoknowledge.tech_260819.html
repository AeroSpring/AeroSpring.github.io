<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas></canvas>
  <div id="dom-overlay">
    <div id="gizmo-block">
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script type="module">

    // ИЗВЛЕЧЕНИЕ ТЕГОВ ИЗ РАЗМЕТКИ
    let canvas = window.document.querySelector('canvas');
    let domOverlay = window.document.querySelector('#dom-overlay');
    let gizmoBlock = window.document.querySelector('#gizmo-block');

    // СОЗДАНИЕ ДВИЖКА
    let engine = new BABYLON.Engine(canvas);

    // СОЗДАНИЕ СЦЕНЫ И ПРИСОЕДИНЕНИЕ ЕЁ К ДВИЖКУ
    let scene = new BABYLON.Scene(engine);
    scene.createDefaultEnvironment({
      createSkybox: false,
      createGround: false
    });

    // СОЗДАНИЕ СВЕТА
    let light = new BABYLON.PointLight('light', new BABYLON.Vector3(10, 10, -2), scene);
    light.intensity = 0.7;

    // ПОДКЛЮЧЕНИЕ WEBXR
    scene.createDefaultXRExperienceAsync({
      uiOptions: {
        sessionMode: 'immersive-ar',
        referenceSpaceType: 'local-floor',
      }
    });

    // ПОДКЛЮЧЕНИЕ GIZMO
    let gizmoManager = new BABYLON.GizmoManager(scene);



    // ПЕРЕМЕННЫЕ
    let editingElement = null;
    const frameRate = 20; // скорость анимации (кадров в секунду)



    // ФУНКЦИИ

    // ФУНКЦИИ АНИМАЦИИ

    // СОЗДАНИЕ АНИМАЦИИ ПЕРЕМЕЩЕНИЯ
    const animationPosition = new BABYLON.Animation(
      "positionAnimation",
      "position.y", // анимируемое свойство
      frameRate, // скорость анимации (кадров в секунду)
      BABYLON.Animation.ANIMATIONTYPE_FLOAT // тип данных
    );
    // СОЗДАНИЕ КАДРОВ АНИМАЦИИ ПЕРЕМЕЩЕНИЯ
    const keysPosition = [];
    keysPosition.push({
      frame: 0,
      value: 1.0
    });
    keysPosition.push({
      frame: frameRate,
      value: 1.5
    });
    keysPosition.push({
      frame: 2 * frameRate,
      value: 1.0
    });
    animationPosition.setKeys(keysPosition);

    // СОЗДАНИЕ АНИМАЦИИ ВРАЩЕНИЯ
    const animationRotate = new BABYLON.Animation(
      "rotationAnimation",
      "rotation.y", // анимируемое свойство
      30, // скорость анимации (кадров в секунду)
      BABYLON.Animation.ANIMATIONTYPE_FLOAT // тип данных
    );
    // СОЗДАНИЕ КАДРОВ АНИМАЦИИ ВРАЩЕНИЯ
    const keysRotate = [];
    keysRotate.push({
      frame: 0,
      value: 0
    });
    keysRotate.push({
      frame: frameRate,
      value: Math.PI * 2 // Оборачиваемся на 360 градусов (2 * PI)
    });
    animationRotate.setKeys(keysRotate);



    // ФУНКЦИИ ДЛЯ GIZMO
    const clearGizmoOptions = () => {
      gizmoManager.positionGizmoEnabled = false;
      gizmoManager.boundingBoxGizmoEnabled = false;
    }

    const setGizmoOption = (option, _marker = '') => {
      clearGizmoOptions();
      switch (option) {
        case 'animation': {
          switch (_marker) {
            case 'base': {
              document.location.href = 'https://autoknowledge.tech/ru/pages';
              break;
            }
            case 'diagnostic': {
              document.location.href = 'https://autoknowledge.tech/ru/pages/36';
              break;
            }
            case 'oil': {
              document.location.href = 'https://autoknowledge.tech/ru/pages/34';
              break;
            }
            case 'smoke': {
              document.location.href = 'https://autoknowledge.tech/ru/pages/33';
              break;
            }

            // default: {
            //   //window.location = 'https://okru.ru/userpubl/aerospring';
            //   document.location.href = 'https://autoknowledge.tech/ru/pages/36';
            // }
          }
          closeGizmo()
          break;
        }
        case 'dispose': {
          closeGizmo(true)
          break;
        }
        default: break;
      }
    }

    const closeGizmo = (needDispose = false) => {
      clearGizmoOptions();
      gizmoManager._attachedMesh = null;
      gizmoManager.enableAutoPicking = true;
      gizmoBlock.style.display = 'none';
      (needDispose)
        ? editingElement.dispose()
        : editingElement = null;
    }



    // ДОБАВЛЕНИЕ МОДЕЛЕЙ
    BABYLON.SceneLoader.ImportMesh(
      null,
      'assets/engine_base/',
      'engine_base.glb',
      scene,
      (meshArray) => {
        let baseMesh = meshArray[0];
        baseMesh.name = 'base'
        baseMesh.scaling = new BABYLON.Vector3(-1.0, 1.0, 1.0);
        baseMesh.position = new BABYLON.Vector3(-0.5, 0.15, 1.5);
        baseMesh.rotation = new BABYLON.Vector3(0, 3.14, 0);
        baseMesh.addShadowCaster(baseMesh); //отбрасываемая тень
        baseMesh.receiveShadows = true; //принимаемая тень
      }
    );

    BABYLON.SceneLoader.ImportMesh(
      null,
      'assets/diagnostic_group/',
      'diagnostic_group.glb',
      scene,
      (meshArray) => {
        let diagnosticMesh = meshArray[0];
        diagnosticMesh.name = 'diagnostic'
        diagnosticMesh.scaling = new BABYLON.Vector3(-1.0, 1.0, 1.0);
        diagnosticMesh.position = new BABYLON.Vector3(-0.5, 0.15, 1.5);
        diagnosticMesh.rotation = new BABYLON.Vector3(0, 3.14, 0);
        diagnosticMesh.addShadowCaster(diagnosticMesh); //отбрасываемая тень
        diagnosticMesh.receiveShadows = true; //принимаемая тень
      }
    );

    BABYLON.SceneLoader.ImportMesh(
      null,
      'assets/p_oil/',
      'p_oil.glb',
      scene,
      (meshArray) => {
        let oilMesh = meshArray[0];
        oilMesh.name = 'oil'
        oilMesh.scaling = new BABYLON.Vector3(-1.0, 1.0, 1.0);
        oilMesh.position = new BABYLON.Vector3(-0.5, 0.15, 1.5);
        oilMesh.rotation = new BABYLON.Vector3(0, 3.14, 0);
        oilMesh.addShadowCaster(oilMesh); //отбрасываемая тень
        oilMesh.receiveShadows = true; //принимаемая тень
      }
    );

    BABYLON.SceneLoader.ImportMesh(
      null,
      'assets/engine_smoke_service/',
      'engine_smoke_service.glb',
      scene,
      (meshArray) => {
        let smokeMesh = meshArray[0];
        smokeMesh.name = 'smoke'
        smokeMesh.scaling = new BABYLON.Vector3(-1.0, 1.0, 1.0);
        smokeMesh.position = new BABYLON.Vector3(-0.5, 0.15, 1.5);
        smokeMesh.rotation = new BABYLON.Vector3(0, 3.14, 0);
        smokeMesh.addShadowCaster(smokeMesh); //отбрасываемая тень
        smokeMesh.receiveShadows = true; //принимаемая тень
      }
    );


    // BABYLON.SceneLoader.ImportMesh(
    //   null, 
    //   'assets/model1C/', 
    //   'model1C.glb', 
    //   scene, 
    //   (meshArray) => {
    //     let model1CMesh = meshArray[0];
    //     model1CMesh.name = 'model1C'
    //     model1CMesh.scaling = new BABYLON.Vector3(0.25, 0.25, 0.25);
    //     model1CMesh.position = new BABYLON.Vector3(-1, 0, 1.5);
    //     model1CMesh.rotation = new BABYLON.Vector3(0, -0.3, 0);
    //     model1CMesh.addShadowCaster(model1CMesh); //отбрасываемая тень
    //     model1CMesh.receiveShadows = true; //принимаемая тень
    //   }
    // );

    // BABYLON.SceneLoader.ImportMesh(
    //   null, 
    //   'assets/Diagnostic_1/', 
    //   'Diagnostic.glb', 
    //   scene, 
    //   (meshArray) => {
    //     let diagnosticMesh = meshArray[0];
    //     diagnosticMesh.name = 'diagnostic'
    //     diagnosticMesh.scaling = new BABYLON.Vector3(-1.0, 1.0, 1.0);
    //     diagnosticMesh.position = new BABYLON.Vector3(-0.5, 0.5, 1.5);
    //     diagnosticMesh.rotation = new BABYLON.Vector3(0, 3.14, 0);
    //     diagnosticMesh.addShadowCaster(diagnosticMesh); //отбрасываемая тень
    //     diagnosticMesh.receiveShadows = true; //принимаемая тень
    //   }
    // );

    // BABYLON.SceneLoader.ImportMesh(
    //   null, 
    //   'assets/drone/', 
    //   'drone.glb', 
    //   scene, 
    //   (meshArray) => {
    //     let droneMesh = meshArray[0];
    //     droneMesh.name = 'drone'
    //     droneMesh.scaling = new BABYLON.Vector3(0.5, 0.5, 0.5);
    //     droneMesh.position = new BABYLON.Vector3(1, 0, 2.5);
    //     shadowGenerator.addShadowCaster(droneMesh); //отбрасываемая тень
    //     droneMesh.receiveShadows = true; //принимаемая тень
    //   }
    // );



    engine.runRenderLoop(() => scene.render());



    // ОБРАБОТЧИКИ СОБЫТИЙ

    // ОБРАБОТЧИКИ СОБЫТИЙ ДЛЯ GIZMO
    gizmoManager.onAttachedToMeshObservable.add((mesh) => {
      // ПОЛУЧАЕМ ИМЯ НАЖАТОЙ МОДЕЛИ
      const marker = scene.getMeshByName(mesh.name);
      //alert(marker.name);

      editingElement = mesh;

      // ВКЛЮЧЕНИЕ АНИМАЦИИ ПРИ НАЖАТИИ
      editingElement.animations = [animationPosition];
      scene.beginAnimation(editingElement, 0, 2 * frameRate); //, true); //циклическое воспроизведение анимации
      //editingElement.animations = [animationRotate];
      //scene.beginAnimation(editingElement, 0, frameRate); // , true); // циклическое воспроизведение анимации

      // ВЫБОР ТОГО, ЧТО ПРОИЗОЙДЁТ ПРИ НАЖАТИИ. ВЫБРАТЬ ЧТО-ТО ОДНО:
      //setGizmoOption('dispose');
      setGizmoOption('animation', marker.name);
      //setGizmoOption('');
    });

  </script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Guide GPS</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- GLTFLoader для Three.js r137 -->
  <script src="https://unpkg.com/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Информационная плитка -->
  <div id="info-tile" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 16px 20px; border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; z-index: 999999; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: auto;">
    <div id="tile-title" style="font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #38bdf8;">Информация о точке</div>
    <div id="tile-coords" style="margin: 4px 0;">Координаты: -</div>
    <div id="tile-distance" style="margin: 4px 0;">Расстояние: -</div>
  </div>

  <!-- Отладочная панель -->
  <div id="debug-panel" style="position: fixed; top: 12px; left: 12px; right: 12px; background: rgba(0, 0, 0, 0.85); color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 11px; z-index: 999999; border: 1px solid #00ff66;">
    <div><b>Мои GPS:</b> <span id="my-coords">Ожидание...</span></div>
    <div><b>Касание:</b> <span id="click-status">Ожидание клика...</span></div>
    <div><b>Дрон 1:</b> <span id="model-status" style="color: #ffff00;">Загрузка...</span> (<span id="dist-1">-</span>)</div>
    <div><b>Модель 1C:</b> <span id="model2-status" style="color: #ffff00;">Загрузка...</span> (<span id="dist-2">-</span>)</div>
    <div><b>Ремонт двигателей и КПП:</b> <span id="model3-status" style="color: #ffff00;">Загрузка...</span> (<span id="dist-3">-</span>)</div>
    <div><b>Медицинский домик:</b> <span id="model3-status" style="color: #ffff00;">Загрузка...</span> (<span id="dist-4">-</span>)</div>
    
    <!-- Ползунок радиуса -->
    <div style="margin-top: 8px; pointer-events: auto; display: flex; align-items: center; justify-content: space-between;">
      <label for="radius-range" style="margin-right: 6px;"><b>Радиус:</b></label>
      <input type="range" id="radius-range" min="0" max="100" value="50" step="0.1" style="flex-grow: 1; accent-color: #00ff66; cursor: pointer;">
      <span id="radius-value" style="margin-left: 8px; color: #38bdf8; min-width: 60px; text-align: right;">- км</span>
    </div>

    <!-- Блок категорий со шторкой -->
    <div style="margin-top: 8px; pointer-events: auto; border-top: 1px dashed rgba(0,255,102,0.4); padding-top: 6px;">
      <!-- Шапка шторки (кнопка разворачивания) -->
      <div id="category-toggle-header" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; background: rgba(0,255,102,0.1); padding: 4px 6px; border-radius: 4px;">
        <span id="category-status-text">Категории: 4 из 4 выбрано</span>
        <span id="category-arrow" style="font-weight: bold; font-size: 13px;">▼</span>
      </div>

      <!-- Выпадающий список категорий по одной на строку -->
      <div id="category-dropdown-content" style="display: none; margin-top: 6px; max-height: 140px; overflow-y: auto; display: none; flex-direction: column; gap: 4px; padding-right: 2px;">
        <button id="btn-cat-auto" class="category-btn active" data-category="auto" style="background: #00ff66; color: #000; border: none; padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 10px; font-weight: bold; cursor: pointer; text-align: left; width: 100%;">✓ 🚗 Авторемонт</button>
        <button id="btn-cat-it" class="category-btn active" data-category="it" style="background: #00ff66; color: #000; border: none; padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 10px; font-weight: bold; cursor: pointer; text-align: left; width: 100%;">✓ 💻 ИТ-услуги</button>
        <button id="btn-cat-beauty" class="category-btn active" data-category="beauty" style="background: #00ff66; color: #000; border: none; padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 10px; font-weight: bold; cursor: pointer; text-align: left; width: 100%;">✓ 💄 Уход за собой</button>
        <button id="btn-cat-med" class="category-btn active" data-category="med" style="background: #00ff66; color: #000; border: none; padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 10px; font-weight: bold; cursor: pointer; text-align: left; width: 100%;">✓ 🏥 Медицина</button>
      </div>
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-camera 
      gps-camera="minDistance: 0; maxDistance: 100000;" 
      rotation-reader
      raycaster="objects: .clickable-hitbox; interval: 100;"
      cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>


    <!-- Первая модель (Дрон) - категория: auto -->
    <a-entity
      id="target-marker-1"
      gps-entity-place="latitude: 44.972541; longitude: 41.145972;"
      position="0 235 0"
      smooth-position
      ground-beam="color: #00ff66; targetHeight: 235"
      data-category="auto">
      <!-- Внутренний контейнер, который крутится и масштабируется к камере -->
      <a-entity billboard-scale="multiplier: 0.1">
        <!-- Сама 3D модель -->
        <a-entity id="model1-container"></a-entity>
        <!-- Увеличиваем хитбокс и центрируем его, чтобы он покрывал весь объем дрона -->
        <a-plane 
          id="hitbox-1" 
          class="clickable-hitbox" 
          width="8" 
          height="8"
          position="0 0 0"
          material="opacity: 0.0; transparent: true; side: double; shader: flat;"
          data-title="Дрон (Авторемонт)"
          data-lat="44.972541"
          data-lng="41.145972"
          data-dist-id="dist-1">
        </a-plane>
      </a-entity>
    </a-entity>


    <!-- Вторая модель (Model 1C) - категория: it -->
    <a-entity
      id="target-marker-2"
      gps-entity-place="latitude: 44.974651; longitude: 41.151093;"
      position="0 235 0"
      smooth-position
      ground-beam="color: #38bdf8; targetHeight: 235"
      data-category="it">
      <!-- Внутренний контейнер, который крутится и масштабируется к камере -->
      <a-entity billboard-scale="multiplier: 0.1">
        <!-- Сама 3D модель -->
        <a-entity id="model2-container"></a-entity>
        <!-- Увеличиваем хитбокс и центрируем его, чтобы он покрывал весь объем дрона -->
        <a-sphere 
          id="hitbox-2" 
          class="clickable-hitbox" 
          width="8" 
          height="8"
          position="0 0 0"
          material="opacity: 0.0; transparent: true; side: double; shader: flat;"
          data-title="Модель 1C (ИТ-услуги)"
          data-lat="44.974651"
          data-lng="41.151093"
          data-dist-id="dist-2">
        </a-sphere>
      </a-entity>
    </a-entity>


    <a-entity
      id="target-marker-3"
      gps-entity-place="latitude: 44.973503; longitude: 41.141933;"
      position="0 235 0"
      smooth-position
      ground-beam="color: #00ff66; targetHeight: 235"
      data-category="auto">
      <!-- Внутренний контейнер, который крутится и масштабируется к камере -->
      <a-entity billboard-scale="multiplier: 0.1">
        <!-- Сама 3D модель -->
        <a-entity id="model3-container"></a-entity>
        <!-- Увеличиваем хитбокс и центрируем его, чтобы он покрывал весь объем дрона -->
        <a-plane 
          id="hitbox-3" 
          class="clickable-hitbox" 
          width="8
          height="8"
          position="0 0 0"
          material="opacity: 0.0; transparent: true; side: double; shader: flat;"
          data-title="Ремонт двигателей и КПП"
          data-lat="44.973503"
          data-lng="41.141933"
          data-dist-id="dist-3">
        </a-plane>
      </a-entity>
    </a-entity>
    

    <a-entity
      id="target-marker-4"
      gps-entity-place="latitude: 44.994807; longitude: 41.127578;"
      position="0 235 0"
      smooth-position
      ground-beam="color: #ef4444; targetHeight: 235"
      data-category="med">
      <!-- Внутренний контейнер, который крутится и масштабируется к камере -->
      <a-entity billboard-scale="multiplier: 0.1">
        <!-- Сама 3D модель -->
        <a-entity id="model4-container"></a-entity>
        <!-- Увеличиваем хитбокс и центрируем его, чтобы он покрывал весь объем дрона -->
        <a-plane 
          id="hitbox-4" 
          class="clickable-hitbox" 
          width="8" 
          height="8"
          position="0 0 0"
          material="opacity: 0.0; transparent: true; side: double; shader: flat;"
          data-title="Медицинский домик"
          data-lat="44.994807"
          data-lng="41.127578"
          data-dist-id="dist-4">
        </a-plane>
      </a-entity>
    </a-entity>


  </a-scene>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
  <title>AR Guide GPS</title>
  <!-- 1. Подключаем A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- 2. Подключаем ar.js (рекомендуемая библиотека) -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
  <!-- 2. Подключаем LocAR.js (рекомендуемая библиотека) -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/locar.js@latest/dist/locar.min.js"></script> -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/locar.js@0.1.0/dist/locar.min.js"></script> -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" /> -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Стили для информационной панели */
    #info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-family: sans-serif;
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }

    #info-panel .title {
      font-weight: bold;
      font-size: 1.2em;
    }

    #info-panel .distance {
      font-size: 1em;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <!-- Панель для отображения информации о следующей точке -->
  <div id="info-panel">
    <div class="title" id="next-point-title">Загрузка...</div>
    <div class="distance" id="next-point-distance">Расстояние: -- м</div>
  </div>

  <!-- ОСНОВНАЯ AR СЦЕНА -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-entity gps-camera="gpsMinDistance: 5;"></a-entity>

    <a-box color="red" gps-new-entity-place="latitude: 44.989309; longitude: 41.160941" depth="10" height="10" width="10"></a-box>

    <!-- <a-entity 
      gps-new-entity-place="latitude: 44.989451; longitude: 41.160701"
    >
      <a-cone color="red" radius-bottom="2" radius-top="0.1" height="5" position="0 2.5 0"></a-cone>
      <a-text value="Точка 1" color="white" align="center" position="0 -2 0" scale="3 3 3" background="true"
        background-color="black" background-opacity="0.7" padding="0.3">
      </a-text>
    </a-entity> -->
  </a-scene>


</body>

</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Отладочная панель -->
  <div id="debug-panel">
    <div><b>Статус GPS:</b> <span id="gps-status">Поиск...</span></div>
    <div><b>Мои координаты:</b> <span id="my-coords">-</span></div>
    <div><b>Точка:</b> 44.970635, 41.153389</div>
    <div><b>Дистанция:</b> <span id="calc-dist">-</span></div>
    <div><b>Точность GPS:</b> <span id="gps-accuracy">-</span></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-camera gps-camera="minDistance: 0; maxDistance: 2000;" rotation-reader></a-camera>

    <!-- Корректировка: высота 12 метров, радиус 4 метра -->
    <a-sphere
      id="target-marker"
      gps-entity-place="latitude: 44.970635; longitude: 41.153389;"
      position="0 12 0"
      radius="4"
      material="color: #ff3366; shader: flat;">
    </a-sphere>

  </a-scene>

  <script src="app.js"></script>
</body>
</html>

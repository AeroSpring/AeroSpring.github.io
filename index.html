<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-camera gps-camera="minDistance: 0; maxDistance: 2000;" rotation-reader></a-camera>

    <!-- Поднимаем сферу на 25 метров над землей -->
    <a-sphere
      id="target-marker"
      gps-entity-place="latitude: 44.970635; longitude: 41.153389;"
      position="0 225 0"
      radius="5"
      material="color: #ff3366; shader: flat;">
    </a-sphere>

  </a-scene>

  <!-- Гарантированная инфо-панель поверх всех слоев AR -->
  <div id="debug-panel" style="position: fixed; top: 12px; left: 12px; right: 12px; background: rgba(0, 0, 0, 0.85); color: #00ff66; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; z-index: 999999; pointer-events: none; border: 1px solid #00ff66;">
    <div><b>Статус GPS:</b> <span id="gps-status">Поиск...</span></div>
    <div><b>Мои GPS:</b> <span id="my-coords">Ожидание...</span></div>
    <div><b>Точность:</b> <span id="gps-accuracy">-</span></div>
    <div><b>Дистанция:</b> <span id="calc-dist">-</span></div>
  </div>

  <script src="app.js"></script>
</body>
</html>

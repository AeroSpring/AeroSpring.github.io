<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Плитка с информацией -->
  <div id="info-tile" class="info-tile hidden">
    <p id="info-coords">Координаты: -</p>
    <p id="info-distance">Расстояние: -</p>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Камера с тач-рейкастером и увеличенной дистанцией отрисовки -->
    <a-camera 
      gps-camera="minDistance: 0; maxDistance: 100000;" 
      camera="far: 100000;"
      rotation-reader 
      raycaster="objects: .clickable" 
      cursor="fuse: false; rayOrigin: mouse">
    </a-camera>

  </a-scene>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
  <title>AR Guide GPS</title>
  <!-- 1. Подключаем A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- 2. Подключаем ar.js (рекомендуемая библиотека) -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Стили для информационной панели */
    #info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-family: sans-serif;
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }

    #info-panel .title {
      font-weight: bold;
      font-size: 1.2em;
    }

    #info-panel .distance {
      font-size: 1em;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <!-- Панель для отображения информации о следующей точке -->
  <div id="info-panel">
    <div class="title" id="next-point-title">Загрузка...</div>
    <div class="distance" id="next-point-distance">Расстояние: -- м</div>
  </div>

  <!-- ОСНОВНАЯ AR СЦЕНА -->
  <!-- <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" raycaster-autorefresh> -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- <a-assets>
      <a-asset id="animated-asset" src="./assets/Interactive/Interactive.glb"></a-asset>
    </a-assets> -->

    <a-camera gps-camera='gpsMinDistance: 5'></a-camera>

    <a-entity 
      gps-entity-place="latitude: 44.989412; longitude: 41.160780"
    >
      <!-- <a-box color="red" gps-new-entity-place="latitude: 44.970756; longitude: 41.153319" depth="10" height="10" width="10"></a-box> -->
      <a-cone color="red" radius-bottom="2" radius-top="0.1" height="5" position="0 2.5 0"></a-cone>
      <!-- <a-text value="Точка 1" color="white" align="center" position="0 -2 0" scale="3 3 3" background="true"
        background-color="black" background-opacity="0.7" padding="0.3">
      </a-text> -->
    </a-entity>

  </a-scene>

</body>

</html>

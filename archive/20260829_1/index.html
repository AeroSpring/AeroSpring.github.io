<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Guide GPS</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Информационная плитка со встроенными стилями предельного уровня (z-index) -->
  <div id="info-tile" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 16px 20px; border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; z-index: 999999; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: auto;">
    <div style="font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #38bdf8;">Информация о точке</div>
    <div id="tile-coords" style="margin: 4px 0;">Координаты: 44.970635, 41.153389</div>
    <div id="tile-distance" style="margin: 4px 0;">Расстояние: -</div>
  </div>

  <!-- Отладочная панель -->
  <div id="debug-panel" style="position: fixed; top: 12px; left: 12px; right: 12px; background: rgba(0, 0, 0, 0.85); color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; z-index: 999999; pointer-events: none; border: 1px solid #00ff66;">
    <div><b>Мои GPS:</b> <span id="my-coords">Ожидание...</span></div>
    <div><b>Дистанция:</b> <span id="calc-dist">-</span></div>
    <div><b>Касание:</b> <span id="click-status">Ожидание клика...</span></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-camera gps-camera="minDistance: 0; maxDistance: 100000;" rotation-reader></a-camera>

    <a-entity
      id="target-marker"
      gps-entity-place="latitude: 44.970635; longitude: 41.153389;"
      position="0 225 0">

      <!-- Компактный маркер -->
      <a-sphere
        radius="2"
        material="color: #ff3366; shader: flat;">
      </a-sphere>

      <!-- Невидимый хитбокс -->
      <a-sphere
        id="hitbox"
        radius="12"
        material="opacity: 0; transparent: true;">
      </a-sphere>

    </a-entity>

  </a-scene>

  <script src="app.js"></script>
</body>
</html>
